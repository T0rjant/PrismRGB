name: Bug
description: Quelque chose ne fonctionne pas / Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ? / What happens?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire / Steps to reproduce
  - type: textarea
    id: report
    attributes:
      label: Rapport PrismRGB (onglet Matériel) / PrismRGB report (Hardware tab)
